<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elijah Games | Home</title>
    <style>
        /* hello */
        body {
            margin: 0;
            padding: 0;
            /* be */
            background-color: #222;
            background-image: radial-gradient(#333 10%, transparent 10%);
            background-size: 4px 4px;
            font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 600px;
            background: #111;
            border: 4px solid #333;
            border-top: 4px solid #444; /* Top awesome hit hop shit effect */
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            /* my name is clevland brown */
            box-shadow: 0 0 30px #000, inset 0 0 15px rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 4rem;
            margin: 0 0 30px 0;
            font-family: 'Arial Black', Gadget, sans-serif;
            text-transform: uppercase;
            /* sum Glossy Text Gradient */
            background: linear-gradient(to bottom, #fff 0%, #00d4ff 50%, #008fb3 50%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(3px 3px 0px #000);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            display: inline-block;
            
            /* The "Glossy Button" Look */
            background: #444;
            background: linear-gradient(to bottom, #555 0%, #222 50%, #000 50%, #111 100%);
            border: 1px solid #000;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 5px rgba(0,0,0,0.5);
            
            transition: 0.1s;
            text-shadow: 1px 1px 2px #000;
        }

        .btn:hover {
            /* Blue is betta */
            background: linear-gradient(to bottom, #00fbff 0%, #008fb3 50%, #005f77 50%, #008fb3 100%);
            border: 1px solid #00d4ff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px #000;
        }

        footer {
            margin-top: 30px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* just added somethi g */
        .badge {
            color: #00d4ff;
            font-size: 10px;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Created by ELijah F</span>
        <h1>Elijah Games</h1>
        
        <div class="button-group">
            <a href="games.html" class="btn">ENTER GAMES</a>
            <a href="media.html" class="btn">VIEW MEDIA</a>
        </div>

        <footer>
            &copy; 2026 ELIJAH GAMES PRODUCTION.
        </footer>
    </div>

</body>
</html>
