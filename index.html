<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elijah Games | Home</title>
    <style>
        /* Classic Gaming Aesthetic */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            border: 2px solid #444;
            padding: 3rem;
            background: linear-gradient(145deg, #222, #111);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00d4ff;
            text-shadow: 2px 2px 10px rgba(0, 212, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #00d4ff;
            border-radius: 5px;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn:hover {
            background-color: #00d4ff;
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-3px);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Elijah Games</h1>
        
        <div class="button-group">
            <a href="games.html" class="btn">GAMES</a>
            <a href="media.html" class="btn">MEDIA</a>
        </div>

        <footer>
            &copy; 2024 Elijah Games. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
