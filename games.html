        /* The Classic Game Card */

            background: #333;

            border: 1px solid #555;
            text-align: center;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .game-card:hover {
            border-color: #ffcc00;
            transform: scale(1.05);
            background: #444;
        }

        .game-card img {
            width: 140px;

            border-radius: 3px;
        }

            font-weight: bold;
